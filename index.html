<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joia Gestão — Controle Interno para Joalherias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#1d1b18; --ink2:#5a554c; --muted:#8c867a; --line:#e7e1d6;
  --gold:#a8791f; --gold2:#c9a24a; --gold-soft:#f5ecd9; --side:#1f2a2e; --side2:#2b393e;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a6400; --warn-bg:#fdf1d8; --bad:#b4342b; --bad-bg:#fbe6e3; --info:#2a5f9e; --info-bg:#e5eef9;
  --r:12px; --sh:0 1px 2px rgba(30,25,15,.06),0 4px 14px rgba(30,25,15,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:#e9e4da;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid #34464c;margin-bottom:12px}
.brand svg{flex:none}
.brand b{font-family:"Cormorant Garamond",serif;font-size:24px;letter-spacing:.5px;color:#f1dfae}
.brand small{display:block;font-size:11px;color:#9fb0b4;letter-spacing:.3px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#cfd8da;text-decoration:none;margin-bottom:2px;font-size:13.5px}
nav a:hover{background:var(--side2);color:#fff}
nav a.active{background:linear-gradient(90deg,#a8791f33,transparent);color:#f1dfae;box-shadow:inset 3px 0 0 var(--gold2)}
nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#71878c;margin:14px 10px 6px}
nav .ic{width:18px;text-align:center;opacity:.9}
.gold-box{margin:16px 6px 0;padding:12px;border-radius:10px;background:#16201f;border:1px solid #34464c;font-size:12px}
.gold-box b{color:#f1dfae;font-size:16px}
main{padding:22px 28px 60px;min-width:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:"Cormorant Garamond",serif;font-size:32px;margin:0;font-weight:700}
h1 + p{margin:2px 0 0;color:var(--ink2)}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .lbl{font-size:12px;color:var(--ink2);font-weight:500}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.3px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cfc5b2}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.pri:hover{background:#946a19}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
input.search,select.f{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:200px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;background:#fbf8f2;position:sticky;top:0}
tr:hover td{background:#fcf9f3}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-gold{background:var(--gold-soft);color:#7a5810}.t-mute{background:#eeeae2;color:#5a554c}
.muted{color:var(--muted)} .small{font-size:12px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
.list li:last-child{border:0}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,18,14,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:18px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form textarea{min-height:64px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,input.search:focus{outline:2px solid var(--gold2);outline-offset:-1px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow:auto}
.col{background:#efeae1;border-radius:12px;padding:10px;min-height:200px}
.col h3{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px 8px}
.os{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.os:hover{border-color:var(--gold2)}
.os .n{font-size:11.5px;color:var(--muted)}
.os .t{font-weight:600;margin:3px 0}
/* pdv */
.pdv{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;max-height:62vh;overflow:auto;padding:2px}
.pc{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pc:hover{border-color:var(--gold2);box-shadow:var(--sh)}
.pc .gem{height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);margin-bottom:4px}
.pc .nm{font-weight:600;font-size:13px;line-height:1.25}
.pc .pr{font-weight:700;color:var(--gold)}
.cart li{align-items:flex-start}
.tot{font-size:22px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
.calc-out{font-size:28px;font-weight:700;color:var(--gold)}
.breakdown td{padding:6px 4px;border-bottom:1px dashed var(--line)}
.bm td,.bm th{font-size:13px}
.yes{color:var(--ok);font-weight:700}.no{color:#c2b9a8}.part{color:var(--warn);font-weight:700}
.toast{position:fixed;bottom:20px;right:20px;background:var(--side);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;z-index:60}
.toast.show{opacity:1;transform:none}
.chart-box{position:relative;height:250px}
.bar:hover path{fill:#946a19}
.receipt{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#fff;border:1px dashed #cdbf9f;padding:16px;border-radius:8px;white-space:pre-wrap}
.menu-btn{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.pdv{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:-260px;width:250px;z-index:40;transition:.2s}
  aside.open{left:0}
  .menu-btn{display:inline-flex}
  .g3,.g2{grid-template-columns:1fr}
  main{padding:16px}
  .form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 14 14 6h12l6 8-12 20z" fill="#c9a24a"/><path d="M8 14h24L20 34z" fill="#a8791f"/><path d="M14 6l6 8 6-8M8 14h24M20 14v20" stroke="#f1dfae" stroke-width="1" fill="none"/></svg>
      <div><b>Joia Gestão</b><small>Controle interno da joalheria</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="gold-box">
      <div class="muted small">Cotação ouro 24k (R$/g)</div>
      <b id="sideGold">—</b>
      <div class="muted small" id="sideGoldDt"></div>
      <button class="btn sm" style="margin-top:8px;width:100%;justify-content:center" onclick="editCotacao()">Atualizar cotação</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <div class="row" style="flex:0 1 auto;gap:12px">
        <button class="btn menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
        <div><h1 id="pgTitle"></h1><p id="pgSub"></p></div>
      </div>
      <div id="pgActions" class="row" style="flex:0 1 auto"></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">
  <div class="mh"><h2 id="mTitle"></h2><button class="btn ghost" onclick="closeModal()" aria-label="Fechar">✕</button></div>
  <div class="mb" id="mBody"></div>
  <div class="mf" id="mFoot"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Joia Gestão — sistema de controle interno para joalherias
   Single-page app, dados salvos no navegador (localStorage).
   ============================================================ */
const KEY = 'joia_gestao_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = (v,d=2) => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const uid = () => Math.random().toString(36).slice(2,10);
const iso = d => d.toISOString().slice(0,10);
const today = () => iso(new Date());
const addDays = (n, base=new Date()) => { const d=new Date(base); d.setDate(d.getDate()+n); return iso(d); };
const fmtD = d => d ? d.slice(0,10).split('-').reverse().join('/') : '—';
const monthKey = d => d.slice(0,7);
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* Teor (pureza) dos metais */
const TEORES = {
  'Ouro 24k (999)':0.999,'Ouro 22k (916)':0.916,'Ouro 18k (750)':0.75,'Ouro 14k (585)':0.585,'Ouro 10k (417)':0.417,
  'Prata 950':0.95,'Prata 925':0.925,'Platina 950':0.95,'Aço / Outros':0
};
const CATEGORIAS = ['Anel','Aliança','Brinco','Colar','Corrente','Pingente','Pulseira','Relógio','Conjunto','Piercing','Outros'];
const OS_STATUS = ['Recebido','Em produção','Pronto p/ retirada','Entregue'];
const OS_TIPOS = ['Conserto','Sob encomenda','Ajuste de aro','Solda','Banho / Ródio','Gravação','Polimento / Limpeza','Troca de pedra','Relógio (bateria/revisão)'];
const PAGTOS = ['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Crediário','Troca de ouro'];

/* ---------------- Persistência ---------------- */
let db;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return seed();
}
function nextNum(prefix){ db.seq[prefix] = (db.seq[prefix]||0)+1; return prefix + String(db.seq[prefix]).padStart(4,'0'); }

/* ---------------- Dados de demonstração ---------------- */
function seed(){
  const d = {
    config:{ loja:'Joalheria Demonstração', cnpj:'00.000.000/0001-00', cotacaoOuro:640, cotacaoPrata:7.6, cotacaoData:today(), markup:2.6, maoObraG:45, comissaoPadrao:3 },
    vendedores:[ {id:'v1',nome:'Ana Paula',comissao:3},{id:'v2',nome:'Ricardo',comissao:3},{id:'v3',nome:'Juliana',comissao:4} ],
    ourives:['Seu Antônio (interno)','Oficina Ouro Fino (terceiro)'],
    produtos:[], clientes:[], vendas:[], os:[], compras:[], consig:[], fin:[], movs:[], seq:{}
  };
  const P = (nome,cat,metal,peso,pedras,custo,preco,qtd,forn) => ({id:uid(),codigo:'',nome,categoria:cat,metal,peso,pedras,custo,preco,qtd,min:1,fornecedor:forn,local:'Vitrine',status:'Disponível',criado:addDays(-120)});
  d.produtos = [
    P('Anel Solitário 0,30ct','Anel','Ouro 18k (750)',2.8,'Diamante 0,30ct VS2/G',3900,8900,2,'Lapidação Brilhante Ltda'),
    P('Aliança Tradicional 4mm (par)','Aliança','Ouro 18k (750)',8.2,'',5500,9800,4,'Alianças Real'),
    P('Aliança Anatômica 6mm (par)','Aliança','Ouro 18k (750)',12.5,'',8200,14500,2,'Alianças Real'),
    P('Brinco Ponto de Luz','Brinco','Ouro 18k (750)',1.1,'Zircônia 4mm',650,1490,6,'Grupo Aurum'),
    P('Brinco Argola Média','Brinco','Ouro 18k (750)',3.4,'',2300,4600,3,'Grupo Aurum'),
    P('Corrente Veneziana 50cm','Corrente','Ouro 18k (750)',5.6,'',3700,6900,3,'Correntes Brasil'),
    P('Corrente Cartier 60cm','Corrente','Ouro 18k (750)',9.8,'',6400,11900,1,'Correntes Brasil'),
    P('Pingente Coração Cravejado','Pingente','Ouro 18k (750)',1.6,'Diamantes 0,10ct total',1500,3500,2,'Lapidação Brilhante Ltda'),
    P('Pulseira Riviera Zircônias','Pulseira','Prata 925',9.0,'Zircônias',180,590,5,'Prata Fina SP'),
    P('Colar Gargantilha Pérola','Colar','Ouro 18k (750)',3.0,'Pérola cultivada 8mm',1800,3990,1,'Mar Pérolas'),
    P('Anel Formatura Rubi','Anel','Ouro 18k (750)',6.0,'Rubi sintético',3600,7200,1,'Grupo Aurum'),
    P('Brinco Argola Prata','Brinco','Prata 925',4.0,'',60,189,12,'Prata Fina SP'),
    P('Anel Aparador Diamantes','Anel','Ouro 18k (750)',2.2,'Diamantes 0,08ct',1750,3900,0,'Lapidação Brilhante Ltda'),
    P('Pingente Medalha N. Sra.','Pingente','Ouro 18k (750)',2.0,'',1350,2700,4,'Grupo Aurum'),
    P('Relógio Feminino Dourado','Relógio','Aço / Outros',0,'',420,990,3,'Distribuidora Tempo'),
    P('Conjunto Esmeralda (colar+brinco)','Conjunto','Ouro 18k (750)',5.4,'Esmeraldas naturais',5200,12500,1,'Gemas de Minas'),
    P('Corrente Prata Grumet 70cm','Corrente','Prata 925',22,'',190,520,6,'Prata Fina SP'),
    P('Piercing Ouro Zircônia','Piercing','Ouro 18k (750)',0.5,'Zircônia',190,450,8,'Grupo Aurum'),
  ];
  d.produtos.forEach((p,i)=>{ p.codigo = 'JG' + String(1001+i); });
  d.produtos[12].min = 1; // estoque zerado -> alerta
  const C = (nome,tel,nasc,esp,aro,pref) => ({id:uid(),nome,cpf:'',tel,email:'',nasc,dataEspecial:esp,aro,preferencias:pref,obs:'',criado:addDays(-200)});
  const y = new Date().getFullYear(), m = String(new Date().getMonth()+1).padStart(2,'0');
  d.clientes = [
    C('Mariana Souza','(11) 98888-1111',`1990-${m}-22`,'Aniversário de casamento 12/06','14','Ouro amarelo, peças delicadas'),
    C('Carlos Henrique Lima','(11) 97777-2222','1982-03-09','Noivado previsto para dez.','22','Relógios, correntes grossas'),
    C('Fernanda Oliveira','(11) 96666-3333',`1978-${m}-05`,'','16','Pérolas e brilhantes'),
    C('Roberto Almeida','(11) 95555-4444','1969-11-30','Bodas de prata 2027','24','Alianças, anéis masculinos'),
    C('Patrícia Gomes','(11) 94444-5555','1995-07-14','','13','Prata, brincos'),
    C('João Pedro Santos','(11) 93333-6666','2000-01-19','Formatura em 2026','20','Anel de formatura'),
    C('Luciana Ribeiro','(11) 92222-7777','1987-05-02','','15','Esmeraldas, peças statement'),
    C('Gustavo Martins','(11) 91111-8888','1992-09-27','Pedido de casamento','21','Solitários'),
  ];
  // vendas dos últimos 6 meses
  const rnd = (a,b)=> a+Math.floor(Math.random()*(b-a+1));
  for(let back=170; back>=0; back-=rnd(2,5)){
    const p = d.produtos[rnd(0,d.produtos.length-1)];
    const cli = d.clientes[rnd(0,d.clientes.length-1)];
    const v = d.vendedores[rnd(0,2)];
    const desconto = Math.random()<.3 ? Math.round(p.preco*0.05) : 0;
    d.seq.V = (d.seq.V||0)+1;
    const data = addDays(-back);
    d.vendas.push({id:uid(),numero:'V'+String(d.seq.V).padStart(4,'0'),data,clienteId:cli.id,vendedorId:v.id,
      itens:[{produtoId:p.id,nome:p.nome,codigo:p.codigo,qtd:1,preco:p.preco,custo:p.custo,categoria:p.categoria}],
      desconto,total:p.preco-desconto,pagamento:PAGTOS[rnd(0,3)],parcelas:1});
    d.fin.push({id:uid(),data,venc:data,tipo:'Entrada',categoria:'Venda',descricao:'Venda V'+String(d.seq.V).padStart(4,'0'),valor:p.preco-desconto,pago:true});
  }
  // ordens de serviço
  const O = (cli,tipo,desc,peca,valor,sinal,prazo,status,dias) => { d.seq.OS=(d.seq.OS||0)+1; return {id:uid(),numero:'OS'+String(d.seq.OS).padStart(4,'0'),data:addDays(-dias),clienteId:cli.id,tipo,descricao:desc,peca,pesoEntrada:'',valor,sinal,prazo,status,ourives:d.ourives[0],obs:''}; };
  d.os = [
    O(d.clientes[0],'Ajuste de aro','Diminuir aro de 16 para 14','Anel ouro 18k com zircônia',120,0,addDays(2),'Em produção',3),
    O(d.clientes[1],'Sob encomenda','Anel de noivado solitário 0,40ct, aro 15, ouro branco','Peça nova',9800,4900,addDays(18),'Em produção',6),
    O(d.clientes[2],'Solda','Corrente veneziana partida','Corrente 45cm 18k',90,0,addDays(-1),'Recebido',5),
    O(d.clientes[3],'Gravação','Gravar "Roberto & Sílvia 25 anos"','Par de alianças',150,150,addDays(1),'Pronto p/ retirada',4),
    O(d.clientes[4],'Banho / Ródio','Banho de ródio em anel branco','Anel ouro branco',180,90,addDays(5),'Recebido',1),
    O(d.clientes[6],'Troca de pedra','Substituir esmeralda lascada','Brinco esmeralda',650,300,addDays(10),'Recebido',2),
    O(d.clientes[5],'Relógio (bateria/revisão)','Troca de bateria + vedação','Relógio masculino',80,80,addDays(-8),'Entregue',10),
  ];
  // compras de ouro
  d.seq.CO = 2;
  d.compras = [
    {id:uid(),numero:'CO0001',data:addDays(-12),vendedorNome:'Cliente balcão — Maria José',cpf:'000.000.000-00',descricao:'Corrente partida + brinco sem par',peso:6.4,metal:'Ouro 18k (750)',cotacao:640,percentual:85,valor:Math.round(6.4*.75*640*.85),pagamento:'PIX',destino:'Fundição'},
    {id:uid(),numero:'CO0002',data:addDays(-3),vendedorNome:'Fernanda Oliveira',cpf:'',descricao:'Anel antigo (abatido em compra)',peso:3.1,metal:'Ouro 18k (750)',cotacao:640,percentual:90,valor:Math.round(3.1*.75*640*.9),pagamento:'Troca de ouro',destino:'Reaproveitar na oficina'}
  ];
  // consignação
  d.seq.CG = 1;

/* Formulário genérico */
function field(f, v){
  const id = 'f_'+f.k, cls = f.full?'full':'';
  const val = v ?? f.def ?? '';
  let inp;
  if(f.type==='select') inp = `<select id="${id}">${f.options.map(o=>{const ov=typeof o==='object'?o.v:o, ol=typeof o==='object'?o.l:o; return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea') inp = `<textarea id="${id}">${esc(val)}</textarea>`;
  else if(f.type==='checkbox') inp = `<input type="checkbox" id="${id}" ${val?'checked':''} style="width:auto">`;
  else inp = `<input id="${id}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(val)}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}">`;
  return `<div class="${cls}"><label for="${id}">${esc(f.label)}${f.req?' *':''}</label>${inp}</div>`;
}
function openForm(title, fields, obj, onSave, extraFoot=''){
  openModal(title, `<form class="form" id="frm" onsubmit="return false">${fields.map(f=>field(f,obj?.[f.k])).join('')}</form>`,
    `${extraFoot}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="frmSave">Salvar</button>`);
  $('#frmSave').onclick = ()=>{
    const out = {};
    for(const f of fields){
      const el = $('#f_'+f.k);
      let v = f.type==='checkbox' ? el.checked : el.value.trim();
      if(f.type==='number') v = v===''? '' : Number(v);
      if(f.req && (v===''||v==null)){ el.focus(); toast('Preencha: '+f.label); return; }
      out[f.k]=v;
    }
    onSave(out); save(); closeModal(); render();
  };
}

let charts = [];
const kfmt = v => 'R$ '+(v>=1000? (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+'k' : Math.round(v));
function niceMax(m){ if(m<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(m))); const n=m/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
/* Gráfico de barras em SVG puro (sem dependências), com tooltip ao passar o mouse */
function barChart(labels, vals, horiz){
  const W=560, H=250, max=niceMax(Math.max(...vals,0)), ticks=[0,.25,.5,.75,1].map(t=>t*max);
  const col='#b8892b', ink='#5a554c', grid='#eee8dc';
  let g='';
  if(!horiz){
    const L=52,R=8,T=10,B=26, pw=W-L-R, ph=H-T-B, bw=Math.min(42,pw/labels.length*.6);
    ticks.forEach(t=>{const y=T+ph-(t/max)*ph; g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${grid}"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${ink}">${kfmt(t)}</text>`;});
    labels.forEach((l,i)=>{const cx=L+pw*(i+.5)/labels.length, h=(vals[i]/max)*ph, y=T+ph-h;
      g+=`<g class="bar"><rect x="${cx-pw/labels.length/2}" y="${T}" width="${pw/labels.length}" height="${ph}" fill="transparent"/><path d="M${cx-bw/2},${T+ph} V${y+Math.min(4,h)} q0,-4 4,-4 H${cx+bw/2-4} q4,0 4,4 V${T+ph}Z" fill="${col}"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${ink}">${esc(l)}</text><title>${esc(l)}: ${brl(vals[i])}</title></g>`;});
  } else {
    const L=96,R=34,T=4,B=22, pw=W-L-R, ph=H-T-B, rh=ph/Math.max(labels.length,1), bh=Math.min(20,rh*.7);
    ticks.forEach(t=>{const x=L+(t/max)*pw; g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${T+ph}" stroke="${grid}"/><text x="${x}" y="${H-6}" text-anchor="middle" font-size="11" fill="${ink}">${kfmt(t)}</text>`;});
    labels.forEach((l,i)=>{const cy=T+rh*(i+.5), w=(vals[i]/max)*pw;
      g+=`<g class="bar"><rect x="0" y="${cy-rh/2}" width="${W}" height="${rh}" fill="transparent"/><path d="M${L},${cy-bh/2} H${L+Math.max(w-4,0)} q4,0 4,4 V${cy+bh/2-4} q0,4 -4,4 H${L}Z" fill="${col}"/><text x="${L-8}" y="${cy+4}" text-anchor="end" font-size="11.5" fill="${ink}">${esc(l)}</text><title>${esc(l)}: ${brl(vals[i])}</title></g>`;});
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Gráfico de barras" style="font-family:Inter,sans-serif">${g}</svg>`;
}

function finalizarVenda(){
  const sub = cart.reduce((s,i)=>s+i.preco*i.qtd,0);
  const desc = cartState.descTipo==='%' ? sub*(Number(cartState.desconto)||0)/100 : Number(cartState.desconto)||0;

  const total = Math.max(0, sub-desc-troca);
  const v = {id:uid(),numero:nextNum('V'),data:today(),clienteId:cartState.cliente,vendedorId:cartState.vendedor,itens:cart.map(i=>({...i})),desconto:desc+troca,total,pagamento:cartState.pagamento,parcelas:Number(cartState.parcelas)};
  db.vendas.push(v);
  v.itens.forEach(i=>{ const p=prodById(i.produtoId); p.qtd-=i.qtd; db.movs.push({id:uid(),data:today(),produtoId:p.id,tipo:'Saída (venda)',qtd:-i.qtd,ref:v.numero}); });

}

function calcOuro(){
  const metal=$('#oMetal').value, peso=Math.max(0,(+$('#oPeso').value||0)-(+$('#oDesc').value||0)), cot=+$('#oCot').value||0, pct=+$('#oPct').value||0;
  const t = TEORES[metal]; const base = metal.startsWith('Prata') ? db.config.cotacaoPrata/0.999 : cot;
  const puro = peso*t, valMetal = puro*base, pagar = valMetal*pct/100;
  $('#oOut').innerHTML = `<tr><td>Peso líquido</td><td class="num">${num(peso,2)} g</td></tr><tr><td>Metal puro (${num(t*100,1)}%)</td><td class="num">${num(puro,3)} g</td></tr><tr><td>Valor do metal</td><td class="num">${brl(valMetal)}</td></tr><tr><td><b>Valor a pagar (${pct}%)</b></td><td class="num calc-out">${brl(pagar)}</td></tr><tr><td class="small muted">Margem bruta na fundição</td><td class="num small muted">${brl(valMetal-pagar)}</td></tr>`;
  return {metal,peso,cot,pct,pagar};
}
function regCompraOuro(){

}

function calcPreco(){
  const metal=$('#kMetal').value, peso=+$('#kPeso').value||0, perda=+$('#kPerda').value||0, mo=+$('#kMO').value||0, pedra=+$('#kPedra').value||0, extra=+$('#kExtra').value||0, mk=+$('#kMk').value||1, imp=+$('#kImp').value||0;
  const metalV = metalGramValue(metal, peso*(1+perda/100)), maoV = mo*peso, custo = metalV+maoV+pedra+extra;

    <tr><td><b>Custo total</b></td><td class="num"><b>${brl(custo)}</b></td></tr>
    <tr><td><b>Preço sugerido (×${num(mk,1)})</b></td><td class="num calc-out">${brl(Math.ceil(preco/10)*10-0.1)}</td></tr>

/* ============================================================
   PRODUÇÃO (PCP) — ordens de produção com controle por etapa

   etapas internas/terceiros, peso de entrada/saída, perdas,
   recuperação de metal, carga por setor e finalização integrada.

const ETAPAS_PADRAO = [
  {nome:'Design / Modelagem (CAD/cera)', tol:0,   setor:'Modelagem'},
  {nome:'Fundição',                      tol:3,   setor:'Fundição', fundicao:true},
  {nome:'Montagem / Ourivesaria',        tol:1.5, setor:'Bancada'},
  {nome:'Cravação',                      tol:0.5, setor:'Cravação'},
  {nome:'Polimento / Acabamento',        tol:2,   setor:'Polimento'},
  {nome:'Banho / Ródio',                 tol:0,   setor:'Galvanoplastia'},
  {nome:'Controle de Qualidade',         tol:0,   setor:'Qualidade'},
];
const OP_ORIGENS = ['Pedido de cliente','Reposição de estoque','Estoque mínimo','Histórico de vendas','Mostruário / coleção'];
const PRIORIDADES = ['Normal','Alta','Urgente'];

function ensureProducao(){
  if(db.producao) return;
  db.producao = {etapas:ETAPAS_PADRAO.map(e=>({...e})), terceiros:['Fundição Paulista (terceiro)','Cravação Fina (terceiro)','Galvânica Brilho (terceiro)'], ops:[], metal:[]};
  seedProducao();
}
const P_ = () => db.producao;
const responsaveis = () => [...db.ourives, ...P_().terceiros];
const isTerceiro = r => P_().terceiros.includes(r);
const perdaG = e => (e.pesoEnt!==''&&e.pesoSai!==''&&e.pesoEnt!=null&&e.pesoSai!=null) ? (Number(e.pesoEnt)-Number(e.pesoSai)-(Number(e.recup)||0)) : 0;
const perdaPct = e => Number(e.pesoEnt) ? perdaG(e)/Number(e.pesoEnt)*100 : 0;
const opPesoAtual = op => { const d=op.etapas.filter(e=>e.done && Number(e.pesoSai)>0); return d.length ? Number(d[d.length-1].pesoSai) : Number(op.pesoPrevisto)||0; };
const opEtapaNome = op => op.status==='Finalizada' ? 'Concluída' : op.status==='Cancelada' ? 'Cancelada' : op.atual>=op.etapas.length ? 'Finalização' : op.etapas[op.atual].nome;
const opAtrasada = op => op.status==='Em produção' && op.prazo < today();
const diasEntre = (a,b) => Math.max(0, Math.round((new Date(b)-new Date(a))/864e5));

function metalMov(metal, peso, tipo, ref, data=today()){
  P_().metal.push({id:uid(), data, metal, peso:Math.round(peso*1000)/1000, puro:Math.round(peso*(TEORES[metal]||0)*1000)/1000, tipo, ref});
}

}

function seedProducao(){
  const cli = n => db.clientes[n]?.id || '';

  metalMov('Ouro 18k (750)', 180, 'Entrada (saldo inicial)', 'Abertura', addDays(-40));

  metalMov('Prata 925', 300, 'Entrada (saldo inicial)', 'Abertura', addDays(-40));
  // helper: aplica etapas já concluídas
  const run = (op, hist) => {
    hist.forEach((h,i)=>{
      const e = op.etapas[i]; Object.assign(e,{resp:h[0],tipo:isTerceiro(h[0])?'Terceiro':'Interno',pesoEnt:h[1],pesoSai:h[2],recup:h[3]||0,custo:h[4]||0,ini:addDays(-h[5]),fim:addDays(-h[6]),done:true});
      if(e.fundicao) metalMov(op.metal, -h[1], 'Saída (fundição)', op.numero, e.fim);
      if(e.recup) { metalMov(op.metal, e.recup, 'Retorno (recuperação limalha/canal)', op.numero, e.fim); op.recuperado += e.recup; }
    });
    op.atual = hist.length;
    if(op.atual < op.etapas.length) op.etapas[op.atual].ini = addDays(-(hist.length?hist[hist.length-1][6]:0));
  };
  const I='Seu Antônio (interno)', O='Oficina Ouro Fino (terceiro)', F='Fundição Paulista (terceiro)', C='Cravação Fina (terceiro)', G='Galvânica Brilho (terceiro)';

  run(op, [[I,0,0,0,0,9,9],[F,15.2,14.6,0.35,80,9,7],[O,14.6,14.1,0.3,320,7,5],[I,14.1,14.1,0,0,5,5]]);
  op.etapas[op.atual].resp=I;
  P_().ops.push(op);

  const pa = prodBy('Anel Aparador');
  op = newOP({data:addDays(-3),origem:'Reposição de estoque',produtoRef:pa?.codigo||'',descricao:'Anel Aparador Diamantes (reposição)',categoria:'Anel',metal:'Ouro 18k (750)',qtd:3,pesoPrevisto:6.6,pedras:'Diamantes 0,08ct por peça (24 pedras)',custoPedras:2400,prazo:addDays(-1),prioridade:'Urgente'});
  run(op, [[I,0,0,0,150,3,2]]);
  P_().ops.push(op);

  op = newOP({data:addDays(-1),origem:'Histórico de vendas',descricao:'Aliança Tradicional 4mm (par) — coleção',categoria:'Aliança',metal:'Ouro 18k (750)',qtd:2,pesoPrevisto:16.4,pedras:'',custoPedras:0,prazo:addDays(15),prioridade:'Normal'});

  run(op, [[I,0,0,0,0,14,14],[F,11.2,10.8,0.25,60,13,12],[I,10.8,10.5,0.2,250,12,9],[I,10.5,10.5,0,0,9,9],[I,10.5,10.2,0.18,150,9,7],[G,10.2,10.2,0,90,7,4],[I,10.2,10.2,0,0,4,3]]);
  P_().ops.push(op);

  op = newOP({data:addDays(-30),origem:'Mostruário / coleção',descricao:'Pingente Coração Cravejado — lote',categoria:'Pingente',metal:'Ouro 18k (750)',qtd:2,pesoPrevisto:3.2,pedras:'Diamantes 0,10ct total',custoPedras:900,prazo:addDays(-15),prioridade:'Normal'});

    <div class="n">${o.numero} · ${esc(o.origem)}${o.prioridade!=='Normal'?` · <b style="color:${o.prioridade==='Urgente'?'var(--bad)':'var(--warn)'}">${o.prioridade}</b>`:''}</div>
    <div class="t">${esc(o.descricao)}</div>
    <div class="small muted">${o.qtd}× · ${esc(o.metal)}${o.clienteId?` · ${esc(cliName(o.clienteId))}`:''}</div>
    <div class="row small" style="margin-top:6px;justify-content:space-between"><span class="tag ${late?'t-bad':'t-gold'}" style="flex:0 0 auto">${late?'Atrasada ':'Prazo '}${fmtD(o.prazo)}</span><b style="flex:0 0 auto">${num(opPesoAtual(o),2)} g</b></div>
    ${terc?`<div style="margin-top:6px"><span class="tag t-info">📦 em ${esc(e.resp)}</span></div>`:''}
    ${e && !e.resp && o.status==='Em produção'?`<div style="margin-top:6px"><span class="tag t-warn">sem responsável</span></div>`:''}
    ${e && e.resp && !terc?`<div class="small muted" style="margin-top:6px">👤 ${esc(e.resp)}</div>`:''}
    ${o.status==='Em produção'?`<div class="row" style="margin-top:8px;gap:6px" onclick="event.stopPropagation()">${e?`<button class="btn sm" style="flex:0 0 auto" title="Atribuir / enviar" onclick="atribuirOP('${o.id}')">👤</button>`:''}<button class="btn sm" onclick="${o.atual>=o.etapas.length?`finalizarOP('${o.id}')`:`avancarOP('${o.id}')`}">${o.atual>=o.etapas.length?'Finalizar e dar entrada ✓':'Concluir etapa ▶'}</button></div>`:''}
  </div>`;

function prodQuadro(){
  const ativas = P_().ops.filter(o=>o.status==='Em produção');

function prodCarga(){
  const ativas = P_().ops.filter(o=>o.status==='Em produção');
  const rows = P_().etapas.map((et,i)=>{
    const its = ativas.filter(o=>o.atual===i);
    const feitas = P_().ops.flatMap(o=>o.etapas.filter(e=>e.done && e.nome===et.nome && e.ini && e.fim));
    const lead = feitas.length ? feitas.reduce((s,e)=>s+diasEntre(e.ini,e.fim),0)/feitas.length : 0;
    return {et, n:its.length, pecas:its.reduce((s,o)=>s+Number(o.qtd),0), peso:its.reduce((s,o)=>s+opPesoAtual(o),0), late:its.filter(opAtrasada).length, terc:its.filter(o=>o.etapas[i].resp&&isTerceiro(o.etapas[i].resp)).length, lead};
  });
  const max = Math.max(1,...rows.map(r=>r.pecas));
  // carga por responsável
  const byR = {}; ativas.forEach(o=>{ const e=o.etapas[o.atual]; if(e){ const r=e.resp||'(não atribuído)'; byR[r]=byR[r]||{n:0,pecas:0}; byR[r].n++; byR[r].pecas+=Number(o.qtd);} });
  $('#prodBody').innerHTML = `<div class="grid" style="grid-template-columns:2fr 1fr">
    <div>${table([
      {h:'Setor / etapa',f:r=>`<b>${esc(r.et.nome)}</b><br><span class="small muted">${esc(r.et.setor||'')}</span>`},
      {h:'Carga',f:r=>`<div style="background:#efe9dc;border-radius:4px;height:10px;width:140px"><div style="background:#b8892b;height:10px;border-radius:4px;width:${r.pecas/max*140}px"></div></div>`},
      {h:'OPs',num:1,f:r=>r.n},{h:'Peças',num:1,f:r=>r.pecas},{h:'Metal',num:1,f:r=>num(r.peso,2)+' g'},
      {h:'Em terceiros',num:1,f:r=>r.terc||'—'},{h:'Atrasadas',num:1,f:r=>r.late?`<span class="tag t-bad">${r.late}</span>`:'—'},
      {h:'Tempo médio',num:1,f:r=>r.lead?num(r.lead,1)+' dia(s)':'—'}
    ], rows)}</div>
    <div class="card"><h2>Carga por responsável</h2><ul class="list">${Object.entries(byR).sort((a,b)=>b[1].pecas-a[1].pecas).map(([r,v])=>`<li><span>${esc(r)}${isTerceiro(r)?' <span class="tag t-info">terceiro</span>':''}</span><b>${v.n} OP · ${v.pecas} pç</b></li>`).join('')||'<li class="muted">Sem carga</li>'}</ul>
    <p class="small muted" style="margin-top:10px">O tempo médio usa as etapas já concluídas e ajuda a prometer prazos realistas ao cliente.</p></div>
  </div>`;
}

    {k:'pesoPrevisto',label:'Peso final previsto (g, total)',type:'number',step:'0.01'},
    {k:'pedras',label:'Composição de pedras',full:true,ph:'Ex.: 1 diamante 0,40ct G/VS1 + 12 brilhantes 0,01ct'},
    {k:'custoPedras',label:'Custo das pedras (R$)',type:'number',step:'0.01'},
    {k:'prazo',label:'Prazo',type:'date',req:true},
  ], o, v=>{
    v.qtd=Number(v.qtd)||1; v.custoPedras=Number(v.custoPedras)||0;
    const op = newOP({...v, osId:preset.osId||''}); P_().ops.push(op);
    if(op.osId){ const os=db.os.find(x=>x.id===op.osId); if(os){ os.opId=op.id; os.status='Em produção'; } }
    toast(`OP ${op.numero} aberta`);
  });
}
function opFromOS(id){
  const os = db.os.find(x=>x.id===id); closeModal();
  if(os.opId){ toast('Esta OS já tem OP'); return; }
  editOP({origem:'Pedido de cliente',clienteId:os.clienteId,descricao:os.descricao,prazo:addDays(-2,new Date(os.prazo+'T12:00')),prioridade:'Alta',osId:os.id});
}
function avancarOP(id){
  const op = P_().ops.find(x=>x.id===id); const i = op.atual; const e = op.etapas[i];
  const prev = op.etapas.slice(0,i).filter(x=>x.done && x.pesoSai!=='').pop();
  const ent = e.pesoEnt!=='' ? e.pesoEnt : prev ? prev.pesoSai : '';
  openForm(`${op.numero} — concluir "${e.nome}"`, [
    {k:'resp',label:'Responsável (interno ou terceiro)',type:'select',options:responsaveis(),full:true},
    {k:'pesoEnt',label:e.fundicao?'Metal enviado para fundir (g)':'Peso de entrada (g)',type:'number',step:'0.01'},
    {k:'pesoSai',label:'Peso de saída (g)',type:'number',step:'0.01'},
    {k:'recup',label:'Metal recuperado (limalha, canais, sobras) (g)',type:'number',step:'0.01'},
    {k:'custo',label:'Custo da etapa / mão de obra (R$)',type:'number',step:'0.01'},
    {k:'obs',label:'Observações',type:'textarea',full:true},
  ], {...e, pesoEnt:ent, pesoSai:e.pesoSai!==''?e.pesoSai:ent, resp:e.resp||db.ourives[0]}, v=>{
    Object.assign(e, v, {done:true, fim:today(), tipo:isTerceiro(v.resp)?'Terceiro':'Interno', recup:Number(v.recup)||0, custo:Number(v.custo)||0});
    if(!e.ini) e.ini = today();
    if(e.fundicao && Number(e.pesoEnt)){
      const saldo = saldoMetal()[op.metal]||0;
      metalMov(op.metal, -Number(e.pesoEnt), 'Saída (fundição)', op.numero);
      if(saldo < Number(e.pesoEnt)) setTimeout(()=>toast('Atenção: saldo de '+op.metal+' ficou negativo'),300);
    }
    if(e.recup){ metalMov(op.metal, e.recup, 'Retorno (recuperação limalha/canal)', op.numero); op.recuperado=(op.recuperado||0)+e.recup; }
    if(e.tipo==='Terceiro' && e.custo>0) db.fin.push({id:uid(),data:today(),venc:addDays(15),tipo:'Saída',categoria:'Fornecedores',descricao:`Serviço ${e.nome} — ${e.resp} (${op.numero})`,valor:e.custo,pago:false});
    op.atual = i+1; if(op.atual<op.etapas.length) op.etapas[op.atual].ini = today();
    const pp = perdaPct(e);
    setTimeout(()=>toast(pp>e.tol ? `⚠ Perda de ${num(pp,2)}% acima da tolerância (${num(e.tol,1)}%)` : `Etapa concluída · perda ${num(perdaG(e),2)} g (${num(pp,2)}%)`), 50);
  });
  $('#mBody').insertAdjacentHTML('beforeend', `<p class="small muted" style="margin-top:10px">Tolerância desta etapa: <b>${num(e.tol,1)}%</b>. Perda = entrada − saída − recuperado.${e.fundicao?' O metal enviado sai do saldo de metal da oficina.':''}</p>`);
}
function atribuirOP(id){
  const op = P_().ops.find(x=>x.id===id); const e = op.etapas[op.atual];
  openForm(`${op.numero} — atribuir "${e.nome}"`, [
    {k:'resp',label:'Responsável / prestador',type:'select',options:responsaveis(),full:true},
    {k:'pesoEnt',label:'Peso enviado / entregue (g)',type:'number',step:'0.01'},
    {k:'obs',label:'Instruções',type:'textarea',full:true},
  ], {...e, resp:e.resp||db.ourives[0], pesoEnt:e.pesoEnt!==''?e.pesoEnt:opPesoAtual(op)||''}, v=>{
    Object.assign(e, v, {tipo:isTerceiro(v.resp)?'Terceiro':'Interno', ini:today()});
    toast(isTerceiro(v.resp)?`Peça enviada para ${v.resp} — romaneio registrado`:`Atribuída a ${v.resp}`);
  });
  $('#mBody').insertAdjacentHTML('beforeend','<p class="small muted" style="margin-top:10px">Use ao entregar a peça ao ourives ou ao enviar para um prestador. O peso enviado fica registrado e é conferido no retorno.</p>');
}
function custoOP(op){
  const fund = op.etapas.find(e=>e.fundicao && e.done);
  const metalG = fund ? Number(fund.pesoEnt) - (op.recuperado||0) : opPesoAtual(op);
  const metal = metalGramValue(op.metal, metalG);
  const mao = op.etapas.reduce((s,e)=>s+(Number(e.custo)||0),0);
  return {metalG, metal, mao, pedras:Number(op.custoPedras)||0, total: metal+mao+(Number(op.custoPedras)||0)};
}
function finalizarOP(id){
  const op = P_().ops.find(x=>x.id===id); const c = custoOP(op);
  const unit = c.total/op.qtd; const ref = db.produtos.find(p=>p.codigo===op.produtoRef);
  openModal(`Finalizar ${op.numero}`, `<table class="breakdown">
      <tr><td>Metal consumido (${num(c.metalG,2)} g líquidos)</td><td class="num">${brl(c.metal)}</td></tr>
      <tr><td>Mão de obra / serviços (todas as etapas)</td><td class="num">${brl(c.mao)}</td></tr>
      <tr><td>Pedras</td><td class="num">${brl(c.pedras)}</td></tr>
      <tr><td><b>Custo total</b> (${op.qtd} pç)</td><td class="num"><b>${brl(c.total)}</b></td></tr>
      <tr><td>Custo unitário</td><td class="num">${brl(unit)}</td></tr></table>
    <form class="form" style="margin-top:14px" onsubmit="return false">
      <div><label>Peso final total (g)</label><input id="fpPeso" type="number" step="0.01" value="${opPesoAtual(op)}"></div>
      <div><label>Preço de venda unitário (R$)</label><input id="fpPreco" type="number" step="0.01" value="${ref?ref.preco:Math.ceil(unit*db.config.markup/10)*10}"></div>
      <div class="full"><label>${ref?`Dar entrada no item existente ${esc(ref.codigo)} — ${esc(ref.nome)}`:'Será cadastrado como nova peça no estoque'}</label></div>
    </form>
    ${op.osId?'<p class="small" style="margin-top:8px">🔗 Esta OP é de um <b>pedido de cliente</b>: a peça entra como <b>Reservada</b> e a OS vai para "Pronto p/ retirada".</p>':''}`,
    `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="fpOk">Finalizar e dar entrada</button>`);
  $('#fpOk').onclick = ()=>{
    const peso = +$('#fpPeso').value||0, preco = +$('#fpPreco').value||0;
    let p;
    if(ref){ p=ref; const q0=Number(p.qtd)||0; p.custo = Math.round(((p.custo*q0)+(unit*op.qtd))/(q0+op.qtd)*100)/100; p.qtd = q0+op.qtd; p.preco = preco; }
    else { p = {id:uid(),codigo:'JG'+(1001+db.produtos.length),nome:op.descricao,categoria:op.categoria,metal:op.metal,peso:Math.round(peso/op.qtd*100)/100,pedras:op.pedras||'',custo:Math.round(unit*100)/100,preco,qtd:op.qtd,min:1,fornecedor:'Produção própria',local:op.osId?'Cofre':'Vitrine',status:op.osId?'Reservado':'Disponível',criado:today()}; db.produtos.push(p); }
    db.movs.push({id:uid(),data:today(),produtoId:p.id,tipo:'Entrada (produção)',qtd:op.qtd,ref:op.numero});
    op.status='Finalizada'; op.finalizada=today(); op.pesoFinal=peso; op.custoTotal=c.total; op.produtoId=p.id;
    if(op.osId){ const os=db.os.find(x=>x.id===op.osId); if(os) os.status='Pronto p/ retirada'; }
    save(); closeModal(); render(); toast(`${op.numero} finalizada — ${op.qtd} pç no estoque`);
    setTimeout(()=>etiqueta(p.id), 400);
  };
}
function fichaOP(id){
  const op = P_().ops.find(x=>x.id===id); const c = custoOP(op);
  const os = op.osId ? db.os.find(x=>x.id===op.osId) : null;
  openModal(`${op.numero} — ${op.descricao}`, `
    <div class="grid g3" style="margin-bottom:12px">
      <div><div class="small muted">Origem</div><b>${esc(op.origem)}</b>${os?`<br><span class="small">OS ${os.numero} · ${esc(cliName(os.clienteId))}</span>`:op.clienteId?`<br><span class="small">${esc(cliName(op.clienteId))}</span>`:''}</div>
      <div><div class="small muted">Peças / metal</div><b>${op.qtd}× · ${esc(op.metal)}</b><br><span class="small">previsto ${num(op.pesoPrevisto,2)} g</span></div>
      <div><div class="small muted">Situação</div><span class="tag ${op.status==='Finalizada'?'t-ok':'t-info'}">${esc(opEtapaNome(op))}</span><br><span class="small">prazo ${fmtD(op.prazo)} · ${op.prioridade}</span></div>
    </div>
    ${op.pedras?`<p class="small"><span class="muted">Pedras:</span> ${esc(op.pedras)}</p>`:''}
    <div class="tbl-wrap"><table><thead><tr><th>Etapa</th><th>Responsável</th><th>Datas</th><th class="num">Entrada</th><th class="num">Saída</th><th class="num">Recup.</th><th class="num">Perda</th><th class="num">Custo</th></tr></thead><tbody>
    ${op.etapas.map((e,i)=>{ const pp=perdaPct(e); const cur = i===op.atual && op.status==='Em produção';
      return `<tr style="${cur?'background:#fbf5e6':''}"><td>${e.done?'✅':cur?'▶':'○'} ${esc(e.nome)}</td><td>${esc(e.resp||'—')}${e.tipo==='Terceiro'?' <span class="tag t-info">terc.</span>':''}</td><td class="small">${e.ini?fmtD(e.ini).slice(0,5):''}${e.fim?' → '+fmtD(e.fim).slice(0,5):''}</td>
      <td class="num">${e.pesoEnt!==''?num(e.pesoEnt,2):'—'}</td><td class="num">${e.pesoSai!==''?num(e.pesoSai,2):'—'}</td><td class="num">${e.recup?num(e.recup,2):'—'}</td>
      <td class="num">${e.done&&Number(e.pesoEnt)?`<span class="tag ${pp>e.tol?'t-bad':'t-ok'}">${num(perdaG(e),2)} g · ${num(pp,1)}%</span>`:'—'}</td><td class="num">${e.custo?brl(e.custo):'—'}</td></tr>`;}).join('')}
    </tbody></table></div>
    <table class="breakdown" style="margin-top:12px"><tr><td>Metal líquido consumido</td><td class="num">${num(c.metalG,2)} g · ${brl(c.metal)}</td></tr><tr><td>Mão de obra / serviços</td><td class="num">${brl(c.mao)}</td></tr><tr><td>Pedras</td><td class="num">${brl(c.pedras)}</td></tr><tr><td><b>Custo ${op.status==='Finalizada'?'final':'até agora'}</b></td><td class="num"><b>${brl(c.total)}</b> · ${brl(c.total/op.qtd)}/pç</td></tr></table>`,
    `${op.status==='Em produção'?`<button class="btn danger" style="margin-right:auto" onclick="ask('Cancelar ${op.numero}?',()=>{const o=P_().ops.find(x=>x.id==='${op.id}');o.status='Cancelada';save();render();})">Cancelar OP</button>`:''}
     <button class="btn" onclick="closeModal()">Fechar</button>
     ${op.status==='Em produção'&&op.atual<op.etapas.length?`<button class="btn" onclick="closeModal();atribuirOP('${op.id}')">Atribuir / enviar a terceiro</button>`:''}
     ${op.status==='Em produção'?(op.atual>=op.etapas.length?`<button class="btn pri" onclick="closeModal();finalizarOP('${op.id}')">Finalizar e dar entrada</button>`:`<button class="btn pri" onclick="closeModal();avancarOP('${op.id}')">Concluir etapa atual</button>`):''}`);
}
function sugestoesOP(){
  ensureProducao();
  const emOP = new Set(P_().ops.filter(o=>o.status==='Em produção').map(o=>o.produtoRef).filter(Boolean));
  const baixo = db.produtos.filter(p=>Number(p.qtd)<=Number(p.min||0) && !emOP.has(p.codigo) && p.fornecedor!=='Distribuidora Tempo');
  const lim = addDays(-90); const vend={}; db.vendas.filter(v=>v.data>=lim).forEach(v=>v.itens.forEach(i=>{vend[i.produtoId]=(vend[i.produtoId]||0)+i.qtd;}));
  const giro = db.produtos.filter(p=>vend[p.id]>=2 && Number(p.qtd)<=2 && !emOP.has(p.codigo) && !baixo.includes(p)).sort((a,b)=>vend[b.id]-vend[a.id]);
  const pedidos = db.os.filter(o=>o.tipo==='Sob encomenda' && !o.opId && o.status!=='Entregue');
  const line = (p, origem, extra) => `<li><span><b>${p.codigo}</b> ${esc(p.nome)}<br><span class="small muted">${extra}</span></span><button class="btn sm" onclick='closeModal();editOP(${JSON.stringify({origem,produtoRef:p.codigo,descricao:p.nome+" (reposição)",categoria:p.categoria,metal:p.metal,qtd:Math.max(2,(p.min||1)*2-p.qtd),pesoPrevisto:Math.round(p.peso*Math.max(2,(p.min||1)*2-p.qtd)*100)/100,pedras:p.pedras})})'>Gerar OP</button></li>`;
  openModal('Sugestões de produção', `
    <h3>📋 Pedidos de clientes sem OP</h3><ul class="list">${pedidos.map(o=>`<li><span><b>${o.numero}</b> ${esc(cliName(o.clienteId))}<br><span class="small muted">${esc(o.descricao)}</span></span><button class="btn sm" onclick="opFromOS('${o.id}')">Gerar OP</button></li>`).join('')||'<li class="muted">Nenhum</li>'}</ul>
    <h3 style="margin-top:14px">📉 Abaixo do estoque mínimo</h3><ul class="list">${baixo.map(p=>line(p,'Estoque mínimo',`estoque ${p.qtd} · mínimo ${p.min}`)).join('')||'<li class="muted">Nenhum</li>'}</ul>
    <h3 style="margin-top:14px">🔥 Alto giro (histórico de vendas 90 dias)</h3><ul class="list">${giro.map(p=>line(p,'Histórico de vendas',`${vend[p.id]} vendidas em 90 dias · estoque ${p.qtd}`)).join('')||'<li class="muted">Nenhum</li>'}</ul>`,
    `<button class="btn pri" onclick="closeModal()">Fechar</button>`);
}
function movMetal(){
  openForm('Movimento de metal', [
    {k:'metal',label:'Metal',type:'select',options:Object.keys(TEORES).filter(k=>!k.startsWith('Aço'))},
    {k:'tipo',label:'Tipo',type:'select',options:['Entrada (compra de metal)','Entrada (recuperação / refino)','Saída (envio para refino)','Ajuste de inventário']},
    {k:'peso',label:'Peso (g) — use negativo para ajuste de saída',type:'number',step:'0.01',req:true},
    {k:'ref',label:'Referência / NF',full:true}
  ], {metal:'Ouro 18k (750)'}, v=>{ let p=Number(v.peso); if(v.tipo.startsWith('Saída')) p=-Math.abs(p); metalMov(v.metal,p,v.tipo,v.ref); toast('Movimento lançado'); });
}

/* ---------------- Start ---------------- */
db = load();
route();
</script>
</body>
